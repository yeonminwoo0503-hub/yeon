<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>mobile render check</title>
<style>
  body { margin:0; background:#222; display:flex; gap:16px; padding:16px; font-family:system-ui; }
  figure { margin:0; }
  figcaption { color:#aaa; font-size:12px; padding:4px 2px; }
  iframe { border:0; background:#fff; border-radius:8px; }
</style></head>
<body>
<figure><figcaption>iPhone 14 — 390 × 844</figcaption>
  <iframe width="390" height="844" data-frame></iframe></figure>
<figure><figcaption>iPhone SE — 375 × 667</figcaption>
  <iframe width="375" height="667" data-frame></iframe></figure>
<script>
  const q = '?t=' + Date.now();
  document.querySelectorAll('[data-frame]').forEach(f => { f.src = './index.html' + q; });
</script>
</body></html>
